name: Scrape MAC Notices

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4
      
      - name: Run scraper
        run: |
          python scraper/main.py
      
      - name: Commit changes
        run: |
          git config user.name "MAC Scraper Bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/notices.json
          git diff --quiet || git commit -m "Update notices [automated]"
          git push || echo "No changes to push"
